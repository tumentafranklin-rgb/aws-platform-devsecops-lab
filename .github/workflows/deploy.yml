name: DevSecOps Lab CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "126309364316"
  ECR_REPOSITORY: devsecops-lab-api

jobs:
  build-test-scan-push:
    name: Build, Test, Scan, and Push Docker Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            ./app

      # 3. Test API health endpoint
      - name: Test Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          docker run -d \
            --name devsecops-api-test \
            -p 127.0.0.1:8000:8000 \
            "$ECR_REPOSITORY:$IMAGE_TAG"

          for attempt in $(seq 1 20); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              echo
              echo "API health check passed!"
              docker rm -f devsecops-api-test
              exit 0
            fi

            echo "Waiting for API... attempt $attempt"
            sleep 3
          done

          echo "API health check failed."
          docker logs devsecops-api-test || true
          docker rm -f devsecops-api-test || true
          exit 1

      # 4. Scan image for vulnerabilities
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-lab-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # 5. Diagnose GitHub repository identity
      - name: Diagnose GitHub OIDC context
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GIT_REF: ${{ github.ref }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Repository ID: $REPOSITORY_ID"
          echo "Repository owner: $REPOSITORY_OWNER"
          echo "Repository owner ID: $REPOSITORY_OWNER_ID"
          echo "Git ref: $GIT_REF"
          echo "Workflow: $WORKFLOW"

      # 6. Diagnose actual OIDC claims without printing the token
      - name: Diagnose actual OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);

      # 7. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/GitHubActionsDevSecOpsRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 8. Verify AWS authentication
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 9. Authenticate Docker to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 10. Push Docker image to ECR
      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          if aws ecr describe-images             --repository-name "$ECR_REPOSITORY"             --image-ids "imageTag=$IMAGE_TAG"             --region "$AWS_REGION"             --query 'imageDetails[0].imageDigest'             --output text > /tmp/ecr-image-digest.txt 2>/tmp/ecr-image-error.txt; then

            DIGEST=$(cat /tmp/ecr-image-digest.txt)
            echo "Image already exists in ECR."
            echo "Image digest: $DIGEST"
            echo "Verifying existing ECR image matches local build..."

            docker pull "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            LOCAL_ID=$(docker image inspect               "$ECR_REPOSITORY:$IMAGE_TAG"               --format '{{.Id}}')

            ECR_ID=$(docker image inspect               "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"               --format '{{.Id}}')

            if [ "$LOCAL_ID" != "$ECR_ID" ]; then
              echo "ERROR: Existing ECR image differs from local build."
              exit 1
            fi

            echo "Image identity verified."
            echo "Reusing existing immutable image."

          elif grep -q 'ImageNotFoundException' /tmp/ecr-image-error.txt; then

            echo "Image does not exist in ECR. Pushing new image..."
            docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          else

            echo "ERROR: Unable to verify image in ECR."
            cat /tmp/ecr-image-error.txt
            exit 1

          fi

      # 11. Display published image
      - name: Display published image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Successfully published Docker image:"
          echo "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
  deploy-to-ec2:
    name: Deploy API to EC2 through SSM
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: devsecops-ec2-production
      cancel-in-progress: false

    steps:
      - name: Verify successful CI for deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          WORKFLOW_FILE: deploy.yml
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking successful CI for commit: $SHA"

          RUNS=$(gh api             "repos/$REPO/actions/workflows/$WORKFLOW_FILE/runs"             -f head_sha="$SHA"             -f event="push"             -f status="success"             --method GET)

          COUNT=$(echo "$RUNS" | jq             '[.workflow_runs[] | select(.head_sha == env.SHA and .event == "push" and .conclusion == "success")] | length')

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No successful push CI run found for commit $SHA"
            exit 1
          fi

          echo "SUCCESS: Found successful CI run for commit $SHA"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/GitHubActionsDevSecOpsRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy API through Systems Manager
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT_URL="https://raw.githubusercontent.com/tumentafranklin-rgb/aws-platform-devsecops-lab/${IMAGE_TAG}/scripts/deploy-api.sh"

          PARAMETERS=$(python3 -c '
          import json,sys
          url,tag=sys.argv[1:]
          commands=[
              "set -eu",
              "curl -fsSL --retry 3 --max-time 30 " + url + " -o /tmp/devsecops-deploy.sh",
              "bash -n /tmp/devsecops-deploy.sh",
              "IMAGE_TAG=" + tag + " bash /tmp/devsecops-deploy.sh"
          ]
          print(json.dumps({"commands":commands}))
          ' "$SCRIPT_URL" "$IMAGE_TAG")

          COMMAND_ID=$(aws ssm send-command             --instance-ids i-0410fb2691bb58425             --document-name AWS-RunShellScript             --comment "Deploy DevSecOps API ${IMAGE_TAG}"             --parameters "$PARAMETERS"             --timeout-seconds 600             --query 'Command.CommandId'             --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation               --command-id "$COMMAND_ID"               --instance-id i-0410fb2691bb58425               --query Status               --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            case "$STATUS" in
              Success)
                echo "EC2 deployment completed successfully."
                echo "===== EC2 DEPLOYMENT LOGS ====="
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-0410fb2691bb58425                   --query StandardOutputContent                   --output text
                echo "===== END DEPLOYMENT LOGS ====="
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "EC2 deployment failed."
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-0410fb2691bb58425                   --query StandardErrorContent                   --output text || true
                aws ssm get-command-invocation                   --command-id "$COMMAND_ID"                   --instance-id i-0410fb2691bb58425                   --query StandardOutputContent                   --output text || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for deployment."
          exit 1
