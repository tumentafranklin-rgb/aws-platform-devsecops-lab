name: DevSecOps Lab CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "126309364316"
  ECR_REPOSITORY: devsecops-lab-api

jobs:
  build-test-scan-push:
    name: Build, Test, Scan, and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            ./app

      # 3. Test API health endpoint
      - name: Test Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          docker run -d \
            --name devsecops-api-test \
            -p 127.0.0.1:8000:8000 \
            "$ECR_REPOSITORY:$IMAGE_TAG"

          for attempt in $(seq 1 20); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              echo
              echo "API health check passed!"
              docker rm -f devsecops-api-test
              exit 0
            fi

            echo "Waiting for API... attempt $attempt"
            sleep 3
          done

          echo "API health check failed."
          docker logs devsecops-api-test || true
          docker rm -f devsecops-api-test || true
          exit 1

      # 4. Scan image for vulnerabilities
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-lab-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # 5. Diagnose GitHub repository identity
      - name: Diagnose GitHub OIDC context
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GIT_REF: ${{ github.ref }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Repository ID: $REPOSITORY_ID"
          echo "Repository owner: $REPOSITORY_OWNER"
          echo "Repository owner ID: $REPOSITORY_OWNER_ID"
          echo "Git ref: $GIT_REF"
          echo "Workflow: $WORKFLOW"

      # 6. Diagnose actual OIDC claims without printing the token
      - name: Diagnose actual OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);

      # 7. Authenticate to AWS using GitHub OIDC
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/GitHubActionsDevSecOpsRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 8. Verify AWS authentication
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 9. Authenticate Docker to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 10. Push Docker image to ECR
      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eu

          docker tag \
            "$ECR_REPOSITORY:$IMAGE_TAG" \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      # 11. Display published image
      - name: Display published image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Successfully published Docker image:"
          echo "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
  deploy-to-ec2:
    name: Validate image on EC2 through SSM
    needs: build-test-scan-push
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::126309364316:role/GitHubActionsDevSecOpsRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Validate image on EC2 through SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${IMAGE_TAG}"

          PARAMETERS=$(python3 -c \
            'import json,sys; print(json.dumps({"commands":[
              "set -e; aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 126309364316.dkr.ecr.us-east-1.amazonaws.com && docker pull " + sys.argv[1] + " && docker image inspect " + sys.argv[1] + " >/dev/null && echo EC2_IMAGE_VALIDATION_SUCCEEDED"
            ]}))' \
            "$IMAGE_URI")

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0410fb2691bb58425 \
            --document-name AWS-RunShellScript \
            --comment "Validate DevSecOps API image ${IMAGE_TAG}" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 36); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-0410fb2691bb58425 \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "SSM command status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0410fb2691bb58425 \
                  --query 'StandardOutputContent' \
                  --output text
                echo "EC2 image validation succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0410fb2691bb58425 \
                  --query 'StandardErrorContent' \
                  --output text || true

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id i-0410fb2691bb58425 \
                  --query 'StandardOutputContent' \
                  --output text || true

                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM."
          exit 1
