name: DevSecOps Lab CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "126309364316"
  ECR_REPOSITORY: devsecops-lab-api

jobs:
  build-test-and-push:
    name: Build, Test, and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Authenticate to AWS using GitHub secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Step 4: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 5: Build the Docker image
      - name: Build Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE" \
            ./app

          echo "Built image: $IMAGE"

      # Step 6: Test the FastAPI container
      - name: Test Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG"

          docker run -d \
            --name devsecops-api-test \
            -p 127.0.0.1:8000:8000 \
            "$IMAGE"

          cleanup() {
            docker rm -f devsecops-api-test >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health; then
              echo
              echo "API health check passed!"
              exit 0
            fi

            echo "Waiting for API to become healthy..."
            sleep 3
          done

          echo "ERROR: API health check failed."
          docker logs devsecops-api-test
          exit 1

      # Step 7: Push the tested image to ECR
      - name: Push Docker image to ECR
